[package]
name = "bearbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A compact GTK4 desktop bar for Hyprland, Niri, Sway, and KDE Plasma"
authors = ["Tanay Pant"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tanay1337/bearbar"
repository = "https://github.com/tanay1337/bearbar"
keywords = ["wayland", "gtk4", "status-bar", "hyprland", "desktop"]
categories = ["gui", "os::linux-apis"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6.0"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
libpulse-binding = "2.30.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
system-tray = "0.8.9"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
